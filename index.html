<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Debris Classifier</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1c222b;
      --panel-2: #232a34;
      --text: #f1f4f8;
      --muted: #a8b0bb;
      --line: #3a4350;
      --green: #5dd39e;
      --blue: #6bb7ff;
      --yellow: #f5c451;
      --red: #ff7a7a;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(rgba(17, 19, 24, 0.68), rgba(17, 19, 24, 0.92)),
        url("space_debris_dataset/test images/asteroid_6.jpg") center / cover fixed;
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(18px, 4vw, 48px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      background: rgba(17, 19, 24, 0.72);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      background: rgba(35, 42, 52, 0.88);
    }

    .mark svg {
      width: 19px;
      height: 19px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: 0;
    }

    .subhead {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(0, 1fr);
      gap: clamp(18px, 3vw, 32px);
      padding: clamp(18px, 4vw, 48px);
      align-items: start;
    }

    .panel {
      background: rgba(28, 34, 43, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow);
    }

    .workspace {
      padding: 18px;
    }

    .preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0d0f13;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .file-label,
    .button {
      min-height: 44px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      cursor: pointer;
      text-align: center;
    }

    .file-label:hover,
    .button:hover {
      border-color: var(--blue);
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .results {
      padding: 20px;
    }

    .prediction {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .label {
      color: var(--muted);
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .prediction strong {
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .confidence {
      color: var(--muted);
      font-size: 1rem;
    }

    .meters {
      display: grid;
      gap: 14px;
      margin: 22px 0;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 132px 1fr 54px;
      gap: 12px;
      align-items: center;
    }

    .bar {
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 180ms ease;
    }

    .meter-row:nth-child(2) .fill {
      background: var(--yellow);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 12px;
      min-height: 74px;
    }

    .feature span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .feature strong {
      font-size: 1.15rem;
    }

    .gallery {
      grid-column: 1 / -1;
      padding: 18px;
    }

    .gallery-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .sample {
      border: 1px solid var(--line);
      background: #0d0f13;
      padding: 0;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .sample img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sample[aria-pressed="true"] {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    canvas {
      display: none;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }

      .gallery-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      header {
        align-items: flex-start;
      }

      .meter-row {
        grid-template-columns: 1fr;
      }

      .features {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 13.5 19.5 4 10 19.5l-1.8-7.7L4 13.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M13.2 10.8 20 17.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Space Debris Classifier</h1>
          <p class="subhead">Upload a space image or pick a sample to classify it locally.</p>
        </div>
      </div>
    </header>

    <main>
      <section class="panel workspace" aria-label="Image input">
        <div class="preview" id="preview">
          <p class="empty">Choose an image to start.</p>
        </div>
        <div class="controls">
          <label class="file-label" for="fileInput">
            <span>Upload image</span>
          </label>
          <input id="fileInput" type="file" accept="image/*">
          <button class="button" id="clearButton" type="button">Clear</button>
        </div>
      </section>

      <section class="panel results" aria-label="Classification results">
        <div class="prediction">
          <span class="label">Prediction</span>
          <strong id="predictionText">Waiting</strong>
          <span class="confidence" id="confidenceText">No image selected.</span>
        </div>

        <div class="meters" aria-label="Class scores">
          <div class="meter-row">
            <span>Artificial debris</span>
            <div class="bar"><div class="fill" id="artificialFill"></div></div>
            <span id="artificialScore">0%</span>
          </div>
          <div class="meter-row">
            <span>Natural debris</span>
            <div class="bar"><div class="fill" id="naturalFill"></div></div>
            <span id="naturalScore">0%</span>
          </div>
        </div>

        <div class="features" aria-label="Image features">
          <div class="feature"><span>Brightness</span><strong id="brightnessValue">-</strong></div>
          <div class="feature"><span>Contrast</span><strong id="contrastValue">-</strong></div>
          <div class="feature"><span>Edge Energy</span><strong id="edgeEnergyValue">-</strong></div>
          <div class="feature"><span>Glint Ratio</span><strong id="glintValue">-</strong></div>
        </div>
      </section>

      <section class="panel gallery" aria-label="Sample images">
        <div class="gallery-head">
          <div>
            <h2>Sample Images</h2>
            <p class="subhead">These are loaded from the project dataset.</p>
          </div>
        </div>
        <div class="gallery-grid" id="gallery"></div>
      </section>
    </main>
  </div>

  <canvas id="featureCanvas" width="32" height="32"></canvas>

  <script>
    const model = {
      type: "logistic_regression_classifier",
      labels: ["artificialDebris", "naturalDebris"],
      scaler_mean: [
        0.17474017251131221, 0.18006534151653059, 0.05948885374104988, 0.08951582646716247,
        0.5742991765465167, 0.08614990782637838, 0.13605175168728306, 50.928323651234514,
        0.0638032616892911, 0.09676659125188534, 0.1185697115384615, 0.0986884898190045,
        0.12230509992458521, 0.25213518099547516, 0.2773849924585219, 0.13409455128205125,
        0.16392227564102563, 0.2781297134238309, 0.29930594834087476, 0.16378558634992452,
        0.13937122926093506, 0.19950626885369527, 0.21210407239819, 0.1759697869532428,
        0.08544785079644601, 0.10900104058272629, 0.09025054030256942, 0.09225166093012087,
        0.2759345233330665, 0.1134435283758905, 0.12270871688145363, 0.11096213879772673
      ],
      scaler_scale: [
        0.09390626254168198, 0.07090067116758897, 0.02407040614524166, 0.02841724465379296,
        0.13516090153565194, 0.04124816827332694, 0.05080343441400034, 122.44469261184473,
        0.0538119921930118, 0.07193687935856322, 0.0951509422599772, 0.11886301625980904,
        0.0977282304410965, 0.1336635039520956, 0.15879877693714906, 0.14597487893859915,
        0.19514354877138218, 0.18230838146231962, 0.18733226714985804, 0.15598799005805267,
        0.19665211154547435, 0.22671993991281628, 0.216889560700723, 0.2060439805294295,
        0.037065702467522034, 0.0505075988307235, 0.0345171208213027, 0.04679770230622715,
        0.15720837655812211, 0.05168963531235562, 0.05114059428137739, 0.045736963587544956
      ],
      weights: [
        -0.12413793245959893, 0.1792493893309546, -0.5472875945350356, -0.13890333945040576,
        -0.36556170066411436, -0.5785012653554992, -0.4070015076557097, 0.4247758843850041,
        -0.35914462299812505, 0.4204376256948202, 0.4392116281033441, -0.0793049473172213,
        -0.4871097465639075, 0.29756217837792803, 0.35034282965301977, 0.05347574292999932,
        -0.05688542186748033, -0.08627445344138691, 0.06660317312619266, 0.016653550920526828,
        -0.5961363786609211, -0.30945747147788316, -0.007862927024539368, -0.41038878533632467,
        -0.07681157591953364, 0.7414803528157162, 0.13383626965211723, 0.28251483458125676,
        -0.35607870344486486, -0.1158360373186635, -0.013191082154688175, 0.22294160792157375
      ],
      intercept: 1.0868238628147675
    };

    const samples = [
      "space_debris_dataset/artificialdebris.0.jpg",
      "space_debris_dataset/artificialdebris.10.jpg",
      "space_debris_dataset/artificialdebris.14.jpg",
      "space_debris_dataset/naturaldebris.0.jpg",
      "space_debris_dataset/naturaldebris.10.jpg",
      "space_debris_dataset/naturaldebris.14.jpg",
      "space_debris_dataset/comets/naturaldebris.10.jpg",
      "space_debris_dataset/comets/naturaldebris.14.jpg",
      "space_debris_dataset/test images/asteroid-10-things.jpg",
      "space_debris_dataset/test images/asteroid_6.jpg"
    ];

    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("fileInput");
    const clearButton = document.getElementById("clearButton");
    const gallery = document.getElementById("gallery");
    const canvas = document.getElementById("featureCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    function formatClass(label) {
      return label === "artificialDebris" ? "Artificial Debris" : "Natural Debris";
    }

    function setPreview(src, alt) {
      preview.innerHTML = "";
      const image = document.createElement("img");
      image.src = src;
      image.alt = alt;
      preview.appendChild(image);
      return image;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function extractFeatures(image) {
      ctx.clearRect(0, 0, 32, 32);
      ctx.drawImage(image, 0, 0, 32, 32);
      const data = ctx.getImageData(0, 0, 32, 32).data;
      const arr = new Float32Array(1024);

      for (let i = 0, j = 0; i < data.length; i += 4, j += 1) {
        arr[j] = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255.0;
      }

      let sum = 0;
      let maxVal = 0;
      for (let i = 0; i < 1024; i++) {
        sum += arr[i];
        if (arr[i] > maxVal) maxVal = arr[i];
      }
      const meanVal = sum / 1024;

      let varSum = 0;
      for (let i = 0; i < 1024; i++) {
        const diff = arr[i] - meanVal;
        varSum += diff * diff;
      }
      const stdVal = Math.sqrt(varSum / 1024);

      const sorted = Array.from(arr).sort((a, b) => a - b);
      const medianVal = (sorted[511] + sorted[512]) / 2;
      const glintRatio = maxVal / (medianVal + 0.001);

      const gradMags = [];
      const laps = [];
      const hogCounts = [0, 0, 0, 0, 0, 0, 0, 0];

      for (let y = 0; y < 31; y++) {
        for (let x = 0; x < 31; x++) {
          const dx = arr[y * 32 + (x + 1)] - arr[y * 32 + x];
          const dy = arr[(y + 1) * 32 + x] - arr[y * 32 + x];
          const mag = Math.sqrt(dx * dx + dy * dy);
          gradMags.push(mag);

          const angle = Math.atan2(dy, dx);
          let binIdx = Math.floor(((angle + Math.PI) / (2 * Math.PI)) * 8);
          if (binIdx >= 8) binIdx = 7;
          if (binIdx < 0) binIdx = 0;
          hogCounts[binIdx]++;
        }
      }

      for (let y = 1; y < 31; y++) {
        for (let x = 1; x < 31; x++) {
          const lap = Math.abs(
            4 * arr[y * 32 + x] -
            arr[(y - 1) * 32 + x] -
            arr[(y + 1) * 32 + x] -
            arr[y * 32 + (x - 1)] -
            arr[y * 32 + (x + 1)]
          );
          laps.push(lap);
        }
      }

      let gradSum = 0;
      let maxGrad = 0;
      for (let i = 0; i < gradMags.length; i++) {
        gradSum += gradMags[i];
        if (gradMags[i] > maxGrad) maxGrad = gradMags[i];
      }
      const edgeMean = gradSum / gradMags.length;

      let gradVarSum = 0;
      for (let i = 0; i < gradMags.length; i++) {
        const d = gradMags[i] - edgeMean;
        gradVarSum += d * d;
      }
      const edgeStd = Math.sqrt(gradVarSum / gradMags.length);

      let lapSum = 0;
      for (let i = 0; i < laps.length; i++) lapSum += laps[i];
      const lapMean = lapSum / laps.length;

      let lapVarSum = 0;
      for (let i = 0; i < laps.length; i++) {
        const d = laps[i] - lapMean;
        lapVarSum += d * d;
      }
      const lapStd = Math.sqrt(lapVarSum / laps.length);

      const hogBins = hogCounts.map(c => c / gradMags.length);

      const gridMeans = [];
      for (let by = 0; by < 4; by++) {
        for (let bx = 0; bx < 4; bx++) {
          let bSum = 0;
          for (let y = by * 8; y < (by + 1) * 8; y++) {
            for (let x = bx * 8; x < (bx + 1) * 8; x++) {
              bSum += arr[y * 32 + x];
            }
          }
          gridMeans.push(bSum / 64);
        }
      }

      return [
        meanVal, stdVal, edgeMean, edgeStd, maxGrad,
        lapMean, lapStd, glintRatio,
        ...gridMeans,
        ...hogBins
      ];
    }

    function classify(features) {
      let z = model.intercept;
      for (let i = 0; i < features.length; i++) {
        const scale = model.scaler_scale[i] || 1;
        const norm = (features[i] - model.scaler_mean[i]) / scale;
        z += model.weights[i] * norm;
      }
      const clampedZ = Math.max(-50, Math.min(50, z));
      const probNatural = 1 / (1 + Math.exp(-clampedZ));
      const probArtificial = 1 - probNatural;

      const prediction = probNatural >= 0.5 ? "naturalDebris" : "artificialDebris";
      return {
        prediction,
        scores: {
          artificialDebris: probArtificial,
          naturalDebris: probNatural
        }
      };
    }

    function updateResults(features, result) {
      const artificial = Math.round(result.scores.artificialDebris * 100);
      const natural = Math.round(result.scores.naturalDebris * 100);
      const winningScore = Math.max(artificial, natural);

      document.getElementById("predictionText").textContent = formatClass(result.prediction);
      document.getElementById("confidenceText").textContent = `${winningScore}% confidence from the trained model.`;
      document.getElementById("artificialFill").style.width = `${artificial}%`;
      document.getElementById("naturalFill").style.width = `${natural}%`;
      document.getElementById("artificialScore").textContent = `${artificial}%`;
      document.getElementById("naturalScore").textContent = `${natural}%`;
      document.getElementById("brightnessValue").textContent = features[0].toFixed(3);
      document.getElementById("contrastValue").textContent = features[1].toFixed(3);
      document.getElementById("edgeEnergyValue").textContent = features[2].toFixed(3);
      document.getElementById("glintValue").textContent = features[7].toFixed(1);
    }

    async function classifySource(src, name) {
      const visibleImage = setPreview(src, name);
      const image = await loadImage(src);
      const features = extractFeatures(image);
      updateResults(features, classify(features));
      visibleImage.alt = name;
    }

    function clearSelection() {
      preview.innerHTML = '<p class="empty">Choose an image to start.</p>';
      document.getElementById("predictionText").textContent = "Waiting";
      document.getElementById("confidenceText").textContent = "No image selected.";
      document.getElementById("artificialFill").style.width = "0%";
      document.getElementById("naturalFill").style.width = "0%";
      document.getElementById("artificialScore").textContent = "0%";
      document.getElementById("naturalScore").textContent = "0%";
      document.getElementById("brightnessValue").textContent = "-";
      document.getElementById("contrastValue").textContent = "-";
      document.getElementById("edgeEnergyValue").textContent = "-";
      document.getElementById("glintValue").textContent = "-";
      gallery.querySelectorAll(".sample").forEach(button => button.setAttribute("aria-pressed", "false"));
    }

    samples.forEach(src => {
      const button = document.createElement("button");
      button.className = "sample";
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-label", `Classify ${src.split("/").pop()}`);
      const image = document.createElement("img");
      image.src = src;
      image.alt = "";
      button.appendChild(image);
      button.addEventListener("click", async () => {
        gallery.querySelectorAll(".sample").forEach(item => item.setAttribute("aria-pressed", "false"));
        button.setAttribute("aria-pressed", "true");
        await classifySource(src, src.split("/").pop());
      });
      gallery.appendChild(button);
    });

    fileInput.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      gallery.querySelectorAll(".sample").forEach(button => button.setAttribute("aria-pressed", "false"));
      const url = URL.createObjectURL(file);
      await classifySource(url, file.name);
    });

    clearButton.addEventListener("click", clearSelection);

    classifySource(samples[0], "artificialdebris.0.jpg").catch(() => clearSelection());
  </script>
</body>
</html>
